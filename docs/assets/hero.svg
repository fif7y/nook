<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nook — a calm menu bar for macOS">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232833"/>
      <stop offset="1" stop-color="#1a1e27"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2a1770" flood-opacity="0.55"/>
    </filter>
  </defs>
  <style>
    .h0,.h1,.h2{transform-box:fill-box;transform-origin:100% 50%}
    .h0{animation:t0 5.7s cubic-bezier(.4,0,.2,1) 1.30s infinite both}
    .h1{animation:t1 5.7s cubic-bezier(.4,0,.2,1) 1.25s infinite both}
    .h2{animation:t2 5.7s cubic-bezier(.4,0,.2,1) 1.20s infinite both}
    @keyframes t0{0%{transform:none;opacity:1}8%{transform:translateX(110px) scale(.5);opacity:0}46.5%{transform:translateX(110px) scale(.5);opacity:0}54.5%{transform:none;opacity:1}100%{transform:none;opacity:1}}
    @keyframes t1{0%{transform:none;opacity:1}8%{transform:translateX(62px) scale(.5);opacity:0}46.5%{transform:translateX(62px) scale(.5);opacity:0}54.5%{transform:none;opacity:1}100%{transform:none;opacity:1}}
    @keyframes t2{0%{transform:none;opacity:1}8%{transform:translateX(22px) scale(.5);opacity:0}46.5%{transform:translateX(22px) scale(.5);opacity:0}54.5%{transform:none;opacity:1}100%{transform:none;opacity:1}}
    @media (prefers-reduced-motion: reduce){.h0,.h1,.h2{animation:none}}
</style>

  <rect width="1280" height="400" rx="24" fill="#6841ED"/>

  <!-- wordmark + tagline (brand vectors) -->
  <g transform="translate(196.45 -111.99) scale(0.62)">
    <path opacity="0.5" d="M659.934 497.159C617.558 497.159 591.422 469.754 591.422 431.946C591.422 394.137 618.319 366.225 659.934 366.225C701.803 366.225 728.7 394.137 728.7 431.946C728.7 469.754 702.564 497.159 659.934 497.159ZM659.934 464.679C682.264 464.679 691.653 448.439 691.653 431.946C691.653 416.213 682.01 398.958 659.934 398.958C638.112 398.958 628.469 416.213 628.469 431.946C628.469 447.678 637.858 464.679 659.934 464.679Z" fill="white"/>
    <path d="M770.95 497.159C728.574 497.159 702.438 469.754 702.438 431.946C702.438 394.137 729.335 366.225 770.95 366.225C812.818 366.225 839.716 394.137 839.716 431.946C839.716 469.754 813.579 497.159 770.95 497.159ZM770.95 464.679C793.28 464.679 802.668 448.439 802.668 431.946C802.668 416.213 793.026 398.958 770.95 398.958C749.127 398.958 739.485 416.213 739.485 431.946C739.485 447.678 748.874 464.679 770.95 464.679Z" fill="white"/>
    <path d="M849.887 317H886.427V418.246L923.474 369.272H966.611V371.556L920.683 428.142L973.716 491.579V494.37H929.818L886.427 439.307V494.37H849.887V317Z" fill="white"/>
    <path d="M467 476.395C467 476.395 467.128 444.429 467.128 433.998C467.128 404.538 491.859 383.354 516.756 383.354C541.557 383.354 566.385 405.761 566.385 433.998C566.385 443.227 566.385 476.395 566.385 476.395" stroke="white" stroke-width="35.9477" stroke-linecap="square" stroke-linejoin="round"/>
  </g>
  <!-- tagline as real text (outlines baked "MacOS"; casing fix 2026-08-22) -->
  <text x="640" y="235.2" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif"
        font-size="23" font-weight="600" letter-spacing="0.4" fill="white">A calm menu bar for macOS</text>


  <!-- menu bar strip -->
  <g filter="url(#soft)">
    <rect x="415" y="266" width="450" height="44" rx="12" fill="url(#bar)"/>
    <rect x="415.5" y="266.5" width="449" height="43" rx="11.5" stroke="#ffffff" stroke-opacity="0.06"/>
  </g>

  <g transform="translate(-163 14)">
    <!-- hideable section: tucks into the chevron (onboarding loop) -->
    <g stroke="#dfe3e9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <g class="h0">
        <path d="M608 267a7.5 7.5 0 1 0 7.1 10.2 6.3 6.3 0 0 1-7.1-10.2z"/>
      </g>
      <g class="h1">
        <path d="M650 279.5h15M652 279.5v-6a5.5 5.5 0 0 1 11 0v6M655.8 282a1.7 1.7 0 0 0 3.4 0"/>
      </g>
      <g class="h2">
        <path d="M700 267.5v11.5M700 267.5c2.5.5 5 1.5 5 4.5"/>
        <circle cx="697.4" cy="279.3" r="2.9"/>
      </g>
    </g>

    <!-- chevron divider -->
    <g stroke="#9aa2b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M736 268l-6 6 6 6"/>
    </g>

    <!-- visible section: never moves -->
    <g stroke="#dfe3e9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="772" cy="272" r="6.2" fill="none"/>
      <path d="M776.6 276.6l4.4 4.4"/>
      <g transform="translate(810,264)">
        <rect x="0" y="0" width="17" height="7" rx="3.5" fill="none"/>
        <circle cx="13" cy="3.5" r="1.6" fill="#dfe3e9" stroke="none"/>
        <rect x="0" y="10" width="17" height="7" rx="3.5" fill="none"/>
        <circle cx="4" cy="13.5" r="1.6" fill="#dfe3e9" stroke="none"/>
      </g>
      <g transform="translate(856,266)">
        <path d="M0 5.2a13 13 0 0 1 17 0" fill="none"/>
        <path d="M3.2 9a8.6 8.6 0 0 1 10.6 0" fill="none"/>
        <circle cx="8.5" cy="13" r="1.7" fill="#dfe3e9" stroke="none"/>
      </g>
      <g transform="translate(896,266.5)">
        <rect x="0" y="0" width="22" height="11" rx="3" fill="none"/>
        <path d="M24 3.6v3.8" stroke-width="2"/>
        <rect x="2" y="2" width="13" height="7" rx="1.6" fill="#dfe3e9" stroke="none"/>
      </g>
    </g>
    <text x="938" y="279.5"
          font-family="-apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif"
          font-size="14.5" font-weight="500" letter-spacing="0.2" fill="#dfe3e9">Wed 9:41</text>
  </g>
</svg>
