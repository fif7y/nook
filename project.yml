name: Nook
options:
  bundleIdPrefix: app.fif7y
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  NookCore:
    path: Packages/NookCore
  NookEngine:
    path: Packages/NookEngine
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0
schemes:
  Nook:
    build:
      targets:
        Nook: all
    test:
      targets:
        - NookTests
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - Nook
    dependencies:
      - package: NookCore
      - package: NookEngine
        product: NookEngine
      - package: Sparkle
        product: Sparkle
    info:
      path: Nook/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Gabriel Faucon"
        SUFeedURL: https://fif7y.github.io/nook/appcast.xml
        SUPublicEDKey: HyfGTw9yRC/C2CUxxamEhzxZuK+WWuG7WPI6F+BUOgE=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fif7y.Nook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_APP_SANDBOX: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YW9UY68SQ7
  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NookTests
    dependencies:
      - target: Nook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YW9UY68SQ7
