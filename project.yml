name: Nook
options:
  bundleIdPrefix: app.fif7y
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  NookCore:
    path: Packages/NookCore
  NookEngine:
    path: Packages/NookEngine
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - Nook
    dependencies:
      - package: NookCore
      - package: NookEngine
        product: NookEngine
      - package: Sparkle
        product: Sparkle
    info:
      path: Nook/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Gabriel Faucon"
        SUFeedURL: https://fif7y.github.io/nook/appcast.xml
        SUPublicEDKey: REPLACE_WITH_SPARKLE_ED25519_PUBLIC_KEY
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fif7y.Nook
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_APP_SANDBOX: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YW9UY68SQ7
