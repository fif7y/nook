# Release CI: archive → notarize → staple → DMG → appcast.
#
# NOTE: Nook targets macOS 27 — this workflow needs a runner image carrying the
# macOS 27 SDK (Xcode beta). Until GitHub hosts one, run scripts/release.sh
# locally; this workflow is the same pipeline, kept ready.
#
# Required repository secrets:
#   DEVELOPER_ID_P12          base64 of the Developer ID Application .p12
#   DEVELOPER_ID_P12_PASSWORD
#   NOTARY_KEY_ID             App Store Connect API key id
#   NOTARY_ISSUER_ID          App Store Connect issuer id
#   NOTARY_KEY_P8             contents of the AuthKey_*.p8
#   SPARKLE_PRIVATE_KEY       EdDSA private key (from `generate_keys -x`)
#
# SECURITY: SPARKLE_PRIVATE_KEY converts into arbitrary code on every install
# (it signs updates). Prefer keeping it OFF CI entirely: run the release
# locally where the key lives in the login keychain, and use this workflow
# only for build+notarize with the appcast signed on the dev machine.
name: Release

# Tag trigger disabled until GitHub ships a runner image with the macOS 27 SDK
# (macos-latest is still macos-26 — the job dies at Xcode selection). Releases
# run locally via scripts/release.sh; re-add `push: tags: ["v*"]` when a
# macOS 27 image exists.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    steps:
      # SHA-pinned: this job holds the Developer ID cert, notary key, AND the
      # Sparkle update-signing key — a hijacked action tag must not be able to
      # exfiltrate them. (SHA = v4 tag at pin time.)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: |
          # Pick the newest Xcode on the image; needs the macOS 27 SDK.
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          rm cert.p12

      - name: Store notary credentials
        env:
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$KEY_P8" > AuthKey.p8
          xcrun notarytool store-credentials nook-notary \
            --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$ISSUER_ID"
          rm AuthKey.p8

      - name: Install xcodegen (pinned, checksum-verified)
        run: |
          # NOT brew: an unpinned formula is arbitrary code next to the
          # release secrets. Fixed release + SHA-256.
          curl -sL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          sudo PREFIX=/usr/local xcodegen/install.sh
          rm -rf xcodegen xcodegen.zip
          xcodegen --version

      - name: Import Sparkle signing key
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # generate_appcast reads the key from the keychain; import it there.
          echo "$SPARKLE_KEY" > sparkle_key
          echo "SPARKLE_KEY_FILE=$PWD/sparkle_key" >> "$GITHUB_ENV"

      - name: Build, notarize, package
        run: scripts/release.sh

      - name: Remove Sparkle key file
        if: always()
        run: rm -f sparkle_key

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nook-release
          path: |
            build/releases/*.dmg
            build/releases/appcast.xml
